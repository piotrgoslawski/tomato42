[package]
name = "tomato42-ipc"
version = "0.1.0"
edition = "2021"
description = "IPC server for the tomato42 plant simulator"

[dependencies]
tomato42-core = { path = "../tomato42-core" }
tomato42-protocol = { path = "../tomato42-protocol" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.28", features = ["full"] }